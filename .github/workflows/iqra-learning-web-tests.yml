name: IQRA learning website and academy operations tests

on:
  pull_request:
    paths:
      - "services/iqra-learning-web/**"
      - ".github/workflows/iqra-learning-web-tests.yml"
  push:
    branches:
      - "feature/iqra-academy-ops-rea-20261116"
    paths:
      - "services/iqra-learning-web/**"
      - ".github/workflows/iqra-learning-web-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/iqra-learning-web/requirements-dev.txt
      - name: Install test dependencies
        working-directory: services/iqra-learning-web
        run: python -m pip install -r requirements-dev.txt
      - name: Run learning and academy tests
        working-directory: services/iqra-learning-web
        run: python -m pytest -q
